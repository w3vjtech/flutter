name: Flutter CI Builds

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags:
      - 'v*'
      - 'release-*'
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: Build Android APK/AAB
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK (split per ABI)
        run: flutter build apk --release --split-per-abi --build-number ${{ github.run_number }}

      - name: Build App Bundle (AAB)
        run: flutter build appbundle --release --build-number ${{ github.run_number }}

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: |
            build/app/outputs/**/*.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: |
            build/app/outputs/**/*.aab

  ios:
    name: Build iOS App (no codesign)
    runs-on: macos-latest
    env:
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Ensure CocoaPods
        run: |
          brew --version
          brew install cocoapods || true

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign --build-number ${{ github.run_number }}

      - name: Zip Runner.app
        run: |
          cd build/ios/iphoneos
          zip -r Runner.app.zip Runner.app

      - name: Upload iOS App artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-app
          path: build/ios/iphoneos/Runner.app.zip

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [android, ios]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download Android APKs
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: dist

      - name: Download Android AAB
        uses: actions/download-artifact@v4
        with:
          name: android-aab
          path: dist

      - name: Download iOS App
        uses: actions/download-artifact@v4
        with:
          name: ios-app
          path: dist

      - name: Publish Release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            dist/**/*.apk
            dist/**/*.aab
            dist/**/*.zip