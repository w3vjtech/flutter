name: Flutter CI Builds

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags:
      - 'v*'
      - 'release-*'
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: Build Android APK/AAB
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: latest
          packages: |
            platforms;android-34
            build-tools;34.0.0
            platform-tools

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Doctor (sanity)
        run: flutter doctor -v

      - name: Install dependencies
        run: flutter pub get

      - name: Prepare Android keystore (optional)
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/keystore.jks
          cat > key.properties <<'EOF'
          storeFile=android/app/keystore.jks
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          keyPassword=${ANDROID_KEY_PASSWORD}
          EOF

      - name: Build APK (split per ABI)
        run: flutter build apk --release --split-per-abi --build-number ${{ github.run_number }}

      - name: Build APK (universal)
        run: flutter build apk --release --build-number ${{ github.run_number }}

      - name: Build App Bundle (AAB)
        run: flutter build appbundle --release --build-number ${{ github.run_number }}

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: |
            build/app/outputs/**/*.apk

      - name: Upload Universal APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-universal
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: |
            build/app/outputs/**/*.aab

  ios:
    name: Build iOS App (no codesign)
    runs-on: macos-latest
    env:
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Xcode version
        run: xcodebuild -version

      - name: Install CocoaPods (gem)
        run: sudo gem install cocoapods --no-document

      - name: Pod install
        run: |
          cd ios
          pod repo update
          pod install

      - name: Doctor (sanity)
        run: flutter doctor -v

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign --build-number ${{ github.run_number }}

      - name: Zip Runner.app
        run: |
          cd build/ios/iphoneos
          zip -r Runner.app.zip Runner.app

      - name: Upload iOS App artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-app
          path: build/ios/iphoneos/Runner.app.zip

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [android, ios]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download Android APKs
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: dist

      - name: Download Android AAB
        uses: actions/download-artifact@v4
        with:
          name: android-aab
          path: dist

      - name: Download iOS App
        uses: actions/download-artifact@v4
        with:
          name: ios-app
          path: dist

      - name: Publish Release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            dist/**/*.apk
            dist/**/*.aab
            dist/**/*.zip